name: AegisMed CI/CD Auto-Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            echo "=========================================="
            echo "🚀 [CI/CD] Incoming Push detected on 'main'"
            echo "Updating AegisMed on VPS..."
            echo "=========================================="
            cd /home/ubuntu/aegismed
            git fetch origin main
            git reset --hard origin/main
            docker compose build
            docker compose up -d --remove-orphans
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo "✅ Deployment finished successfully at $(date)!"
